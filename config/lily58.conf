# Uncomment to enable encoder
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment the following line to enable the Lily58 OLED Display
CONFIG_ZMK_DISPLAY=y

# activating zmk_studio onthego
CONFIG_ZMK_STUDIO_LOCKING=n

# Mouse support
CONFIG_ZMK_POINTING=y

# Better connection and power on bt
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Allow legacy (non-SC) pairing. ZMK_BLE selects BT_SMP_SC_PAIR_ONLY by default,
# which makes the desktop's Barrot dongle fail to bond (link drops mid-SMP,
# le-connection-abort-by-local) even though it reports secure-conn support.
# Restored from the `save` branch ("working firmware 4", Apr 2026) — that config
# is empirically known to bond with this dongle; the mechanism is NOT confirmed.
# Hosts with a sane BT stack (e.g. the notebook) work without these.
CONFIG_BT_SMP_SC_ONLY=n
CONFIG_BT_SMP_SC_PAIR_ONLY=n
CONFIG_ZMK_BLE_PASSKEY_ENTRY=y

# Battery level
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
