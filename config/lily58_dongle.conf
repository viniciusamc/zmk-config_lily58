# lily58.conf is applied to this build too (ZMK matches config files by shield
# name prefix), so this file only overrides what differs on the dongle. The
# inherited BT_SMP_SC downgrades are harmless here — the host link is USB.

# No OLED on the dongle; leaving display on fails the build with a missing
# zephyr,display chosen node.
CONFIG_ZMK_DISPLAY=n

CONFIG_ZMK_STUDIO_LOCKING=n

# Central owns the keymap, so mouse behaviors must be built here.
CONFIG_ZMK_POINTING=y

CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
