# Dongle-only config. Deliberately NOT a copy of lily58.conf:
#  - no CONFIG_ZMK_DISPLAY: the dongle has no OLED.
#  - no CONFIG_BT_SMP_SC_* downgrades: those existed to bond with the desktop's
#    Barrot BT dongle, and the host link is USB now. Weakening pairing would
#    only weaken the split links.

CONFIG_ZMK_STUDIO_LOCKING=n

# Central owns the keymap, so mouse behaviors must be built here.
CONFIG_ZMK_POINTING=y

CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
