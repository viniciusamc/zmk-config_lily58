# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#     artifact-name: corne_left_with_studio
#
---
include:
  # No studio-rpc-usb-uart snippet: it breaks BT mode switching (see `save`
  # branch, 763191e). Studio itself stays enabled via the cmake-arg below.
  # Studio lives on the central, which is the dongle now.
  - board: nice_nano@2.0.0//zmk
    shield: lily58_dongle
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  # The in-tree lily58_left shield defaults to central; force it off so both
  # halves are peripherals of the dongle.
  - board: nice_nano@2.0.0//zmk
    shield: lily58_left
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
  - board: nice_nano@2.0.0//zmk
    shield: lily58_right
  # Must be flashed on all three devices before the dongle firmware: old split
  # bonds point the halves at each other.
  - board: nice_nano@2.0.0//zmk
    shield: settings_reset
